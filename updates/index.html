<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FORGE Update</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(92%, 600px);
      padding: 35px;
      border-radius: 22px;
      background: #111722;
      border: 1px solid #273142;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .version {
      margin-top: 10px;
      color: #8fa3bd;
    }

    h2 {
      margin-top: 30px;
    }

    ul {
      text-align: left;
      line-height: 1.8;
    }

    .update-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      border-radius: 12px;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-weight: 700;
    }

    .update-btn:hover {
      opacity: .85;
    }

    .note {
      margin-top: 20px;
      color: #8995a8;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">FORGE</div>

    <div class="version">
      Latest Version: 1.6.0
    </div>

    <h2>🚀 New Update Available</h2>

    <ul>
      <li>Improved video preview</li>
      <li>Better timeline performance</li>
      <li>New editing features</li>
      <li>Bug fixes and stability improvements</li>
    </ul>

    <a
      class="update-btn"
      href="https://YOUR-DOMAIN.com/downloads/FORGE-Video-Editor-Setup.exe"
    >
      Update Now
    </a>

    <div class="note">
      Download the latest Windows installer and install it over your current FORGE installation.
    </div>

  </main>

</body>
</html>
