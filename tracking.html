<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | Faraz Store</title>
    <meta name="description" content="Track your Faraz Store order status in real time.">
    <meta name="theme-color" content="#020617">
    <link rel="icon" href="images/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- CSS Links -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/tracking.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/floating.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="tracking-page-bg">

    <div class="tracking-page glassmorphism">

        <!-- Header -->
        <header class="tracking-header" style="display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative;">
            <a href="orders.html" class="nav-btn-back" style="display: inline-flex; align-items: center; gap: 6px; position: absolute; left: 0; top: 0; text-decoration: none; color: #94a3b8; font-weight: 700; padding: 8px 14px; background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                Back to Orders
            </a>
            
            <div style="display: flex; align-items: center; gap: 10px; margin-top: 40px;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                    <line x1="12" y1="22.08" x2="12" y2="12"/>
                </svg>
                <h1 style="margin: 0; font-family: 'Orbitron', sans-serif; font-size: 24px; color: #fff;">Track Your Order</h1>
            </div>
            <p style="color: var(--muted); font-size: 14px; margin: 0;">Follow your package in real-time</p>
        </header>

        <!-- Order Data Container -->
        <main id="tracking-data">
            <div class="loading-card">
                <div class="loader"></div>
                <h2>Loading Order Details...</h2>
            </div>
        </main>

    </div>

    <!-- Floating Social Actions (Right Side) -->
    <div class="floating-box" id="floatingActions" aria-label="Quick Actions">
        <a href="luck-royale.html" class="floating-btn spin-btn" title="Spin Luck Royale" aria-label="Spin Wheel">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            <span class="floating-tooltip">Luck Royale</span>
        </a>
        <a href="https://instagram.com/faraz_anjum_000" target="_blank" rel="noopener noreferrer" class="floating-btn insta-btn" title="Follow Instagram" aria-label="Instagram">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
            </svg>
            <span class="floating-tooltip">Instagram</span>
        </a>
        <a href="https://youtube.com/@TK_RUSH" target="_blank" rel="noopener noreferrer" class="floating-btn yt-btn" title="Subscribe YouTube" aria-label="YouTube">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            <span class="floating-tooltip">YouTube</span>
        </a>
    </div>

    <!-- Script Integration -->
    <script type="module" src="js/support-agent.js"></script>
    <script type="module" src="js/tracking.js"></script>

</body>

</html>
