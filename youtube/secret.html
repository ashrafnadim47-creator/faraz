<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Vault</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="secret.css">
</head>

<body>

<div id="scene">

    <!-- BACKGROUND -->
    <div class="background">
        <div class="grid"></div>
        <div class="ambient-light"></div>
        <div class="vignette"></div>
        <div id="particles"></div>
    </div>

    <!-- TOP STATUS -->
    <div style="position:fixed;top:18px;left:20px;z-index:99999;"><a href="../index.html" style="background:rgba(15,23,42,0.9);color:#00e5ff;padding:8px 16px;border-radius:20px;border:1px solid #00e5ff;font-family:sans-serif;font-size:12px;font-weight:700;text-decoration:none;">&larr; Faraz Store</a></div><div class="top-text">
        <span class="status-dot"></span>
        <span>SECURE VAULT SYSTEM</span>
    </div>

    <!-- NAME AUTHORIZATION -->
    <div class="name-screen" id="nameScreen">

        <div class="name-card">

            <div class="name-symbol">✦</div>

            <div class="name-small">
                PRIVATE ACCESS
            </div>

            <h1>
                WHAT IS<br>
                YOUR NAME?
            </h1>

            <p>
                Enter your name to continue.
            </p>

            <form id="nameForm">

                <div class="name-input-wrap">
                    <input
                        type="text"
                        id="nameInput"
                        placeholder="ENTER YOUR NAME"
                        maxlength="30"
                        autocomplete="off"
                        required
                    >
                </div>

                <button type="submit" id="authorizeButton">
                    AUTHORIZE
                    <span>→</span>
                </button>

            </form>

            <div class="name-error" id="nameError"></div>

        </div>

    </div>


    <!-- VAULT -->
    <div class="vault-area" id="vaultArea">

        <div class="vault-frame">

            <div class="vault-body">

                <!-- INSIDE -->
                <div class="vault-inside" id="vaultInside">
                    <div class="inside-glow"></div>

                    <div class="inside-content">
                        <div class="access-symbol">✦</div>

                        <div class="inside-title">
                            ACCESS GRANTED
                        </div>
                    </div>
                </div>

                <!-- OUTER RINGS -->
                <div class="vault-ring outer-ring"></div>
                <div class="vault-ring middle-ring"></div>
                <div class="vault-ring inner-ring"></div>

                <!-- BOLTS -->
                <div class="bolts">
                    <div class="bolt bolt-1"></div>
                    <div class="bolt bolt-2"></div>
                    <div class="bolt bolt-3"></div>
                    <div class="bolt bolt-4"></div>
                    <div class="bolt bolt-5"></div>
                    <div class="bolt bolt-6"></div>
                    <div class="bolt bolt-7"></div>
                    <div class="bolt bolt-8"></div>
                </div>

                <!-- VAULT DOOR -->
                <div class="vault-door" id="vaultDoor">

                    <div class="door-metal"></div>

                    <div class="door-line line-top"></div>
                    <div class="door-line line-bottom"></div>
                    <div class="door-line line-left"></div>
                    <div class="door-line line-right"></div>

                    <!-- CENTER -->
                    <div class="center-plate">

                        <div class="lock-system">
                            <div class="lock-circle"></div>
                            <div class="lock-center"></div>
                        </div>

                        <!-- HANDLE -->
                        <div class="handle" id="handle">
                            <div class="handle-bar"></div>
                            <div class="handle-grip"></div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- STATUS PANEL -->
    <div class="status-panel">

        <div class="status-title">
            SECURITY STATUS
        </div>

        <div class="security-line">
            <span>LOCK SYSTEM</span>
            <b id="lockStatus">LOCKED</b>
        </div>

        <div class="security-line">
            <span>AUTHORIZATION</span>
            <b id="accessStatus">WAITING</b>
        </div>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <div class="message" id="message">
            WAITING FOR AUTHORIZATION...
        </div>

    </div>


    <!-- SKIP -->
    <button class="skip-button" id="skipButton">
        SKIP
    </button>


    <!-- FLASH -->
    <div id="flash"></div>


    <!-- FINAL SCREEN -->
    <div class="final-screen" id="finalScreen">

        <div class="final-icon">
            ✦
        </div>

        <div class="final-small">
            SECURITY SYSTEM
        </div>

        <h1>
            ACCESS GRANTED
        </h1>

        <p>
            THE VAULT IS OPEN
        </p>

        <button id="continueButton">
            CONTINUE
            <span>→</span>
        </button>

    </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>
<script src="secret.js"></script>

</body>
</html>
