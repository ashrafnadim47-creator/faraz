<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders • Faraz Store</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/orders.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/floating.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
</head>

<body class="orders-page-bg">

    <!-- 🚀 HEADER -->
    <header class="header">
        <div class="logo-area">
            <a href="index.html" class="logo">
                <img src="images/logo.png?v=3" alt="Faraz Store" style="width: 36px; height: 36px; border-radius: 50%; object-fit: contain; border: 1.5px solid #00f2fe; box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);">
                <span class="logo-text">FARAZ <span class="logo-highlight">STORE</span></span>
            </a>
        </div>

        <div class="header-buttons">
            <button onclick="location.href='index.html'" title="Home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            </button>
            <button onclick="location.href='product.html'" title="Products">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
            </button>
            <button onclick="location.href='cart.html'" title="Cart">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
            </button>
            <button onclick="location.href='profile.html'" title="Profile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </button>
        </div>
    </header>

    <section class="orders-section" style="max-width: 800px; margin: 30px auto; padding: 0 15px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="font-family: 'Orbitron', sans-serif; font-size: 26px; color: #00e5ff; margin: 0;">
                <span style="display:inline-flex;align-items:center;gap:10px;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg> My Orders</span>
            </h1>
            <a href="product.html" style="color: #94a3b8; font-size: 13px; text-decoration: underline;">+ Browse More</a>
        </div>

        <div id="orders-container">
            <div class="loading-state" style="text-align: center; padding: 40px;">
                <div class="spinner"></div>
                <p style="color: #00e5ff; margin-top: 10px; font-weight: 700;">Fetching Your Orders...</p>
            </div>
        </div>
    </section>

    <!-- Review Popup -->
    <div id="review-popup" class="popup" style="display: none;">
        <div class="popup-box glassmorphism" style="max-width: 400px; margin: 50px auto; padding: 25px; border-radius: 20px; background: rgba(15, 23, 42, 0.95);">
            <h2 style="color: #ffcc00; font-size: 18px; margin-bottom: 12px; display:inline-flex;align-items:center;gap:8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Write Review</h2>
            <select id="rating" style="width: 100%; padding: 10px; border-radius: 8px; background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px;">
                <option value="5">5 / 5 - Excellent</option>
                <option value="4">4 / 5 - Good</option>
                <option value="3">3 / 5 - Average</option>
                <option value="2">2 / 5 - Poor</option>
                <option value="1">1 / 5 - Terrible</option>
            </select>
            <textarea id="review-text" rows="3" placeholder="Write your review here..." style="width: 100%; padding: 10px; border-radius: 8px; background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px;"></textarea>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="window.closeReview()" style="background: transparent; border: 1px solid #64748b; color: #94a3b8; padding: 8px 16px; border-radius: 8px; cursor: pointer;">Cancel</button>
                <button onclick="window.submitReview()" style="background: #00e5ff; color: #020617; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 800; cursor: pointer;">Submit</button>
            </div>
        </div>
    </div>

    <!-- Invoice Popup -->
    <div id="invoice-popup" class="popup" style="display: none;">
        <div class="popup-box glassmorphism" style="max-width: 500px; margin: 40px auto; padding: 25px; border-radius: 20px; background: rgba(15, 23, 42, 0.95); color: #fff;">
            <h2 style="color: #00e5ff; font-size: 20px; margin-bottom: 15px; display:inline-flex;align-items:center;gap:8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Order Invoice</h2>
            <div id="invoice-content" style="background: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-size: 13px; line-height: 1.6;"></div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="window.print()" style="background: #22c55e; color: #020617; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 800; cursor: pointer;">Print</button>
                <button onclick="window.closeInvoice()" style="background: transparent; border: 1px solid #64748b; color: #94a3b8; padding: 8px 16px; border-radius: 8px; cursor: pointer;">Close</button>
            </div>
        </div>
    </div>

    <!-- 🛑 FOOTER -->
    <footer class="footer">
        <div class="footer-brand">
            <h2>⚡ FARAZ STORE</h2>
            <p>India's Premium Gaming & Shopping Destination</p>
        </div>
        <p class="copy">© 2026 Faraz Store • All Rights Reserved</p>
    </footer>

    <!-- 👑 FLOATING SOCIAL ACTIONS (RIGHT SIDE) -->
        <div class="floating-box" id="floatingActions" aria-label="Quick Actions">
        <a href="luck-royale.html" class="floating-btn spin-btn" title="Luck Royale" aria-label="Spin Wheel">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            <span class="floating-tooltip">Luck Royale</span>
        </a>
        <a href="https://www.instagram.com/faraz_anjum_000" class="floating-btn insta-btn" target="_blank" rel="noopener noreferrer" title="Instagram @faraz_anjum_000" aria-label="Instagram">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            <span class="floating-tooltip">Instagram</span>
        </a>
        <a href="https://www.youtube.com/@TK_RUSH" class="floating-btn yt-btn" target="_blank" rel="noopener noreferrer" title="YouTube @TK_RUSH" aria-label="YouTube">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            <span class="floating-tooltip">YouTube</span>
        </a>
    </div>

    <script type="module" src="js/support-agent.js"></script>
    <script type="module" src="js/orders.js"></script>
</body>

</html>
