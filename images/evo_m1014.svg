<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalDraco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="30%" stop-color="#047857"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <circle cx="420" cy="220" r="240" fill="url(#greenGlow)"/>

  <!-- Tech Grid Background lines -->
  <path d="M 0,225 L 800,225 M 400,0 L 400,450" stroke="rgba(34,197,94,0.15)" stroke-width="1.5" stroke-dasharray="8,8"/>

  <!-- EVO GUN SHADOW -->
  <ellipse cx="420" cy="350" rx="260" ry="24" fill="rgba(0,0,0,0.6)"/>

  <!-- EVO M1014 BODY & BARREL -->
  <!-- Main Stock -->
  <polygon points="120,240 220,200 290,200 270,280 180,310 130,300" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  
  <!-- Dragon Spine Scales (Evo Feature) -->
  <polygon points="230,195 250,165 270,195" fill="#10b981" filter="url(#neonGlow)"/>
  <polygon points="280,195 305,160 325,195" fill="#22c55e" filter="url(#neonGlow)"/>
  <polygon points="340,195 365,155 385,195" fill="#4ade80" filter="url(#neonGlow)"/>
  <polygon points="400,195 425,160 445,195" fill="#22c55e" filter="url(#neonGlow)"/>

  <!-- Receiver & Chassis -->
  <polygon points="270,200 480,200 460,260 260,270" fill="url(#metalDraco)" stroke="#4ade80" stroke-width="2"/>
  
  <!-- Dual Shotgun Barrels -->
  <rect x="460" y="202" width="240" height="22" rx="4" fill="#090d16" stroke="#22c55e" stroke-width="2"/>
  <rect x="460" y="226" width="210" height="18" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>

  <!-- Green Draco Energy Core & Vents -->
  <rect x="310" y="215" width="90" height="28" rx="6" fill="#000" stroke="#4ade80" stroke-width="2"/>
  <circle cx="335" cy="229" r="8" fill="#4ade80" filter="url(#neonGlow)"/>
  <circle cx="355" cy="229" r="8" fill="#22c55e" filter="url(#neonGlow)"/>
  <circle cx="375" cy="229" r="8" fill="#86efac" filter="url(#neonGlow)"/>

  <!-- Muzzle Green Flame Effect -->
  <path d="M 700,213 Q 750,190 770,205 Q 740,215 785,213 Q 740,225 765,235 Z" fill="url(#flameGrad)" filter="url(#neonGlow)"/>

  <!-- Pistol Grip & Trigger -->
  <polygon points="260,260 300,260 270,330 230,330" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <path d="M 285,275 Q 295,290 280,300" stroke="#4ade80" stroke-width="3" fill="none"/>

  <!-- Legendary Evo Wing Motif -->
  <path d="M 290,190 Q 380,110 500,140 Q 420,180 370,195 Z" fill="url(#flameGrad)" opacity="0.85" filter="url(#neonGlow)"/>

  <!-- Badge & Typography -->
  <rect x="40" y="40" width="230" height="36" rx="18" fill="rgba(6,78,59,0.7)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="55" y="64" font-family="'Orbitron', sans-serif" font-weight="900" font-size="14" fill="#86efac" letter-spacing="1">⚡ EVO GUN • LEVEL 7</text>

  <text x="40" y="115" font-family="'Orbitron', sans-serif" font-weight="900" font-size="28" fill="#ffffff">M1014 GREEN FLAME</text>
  <text x="40" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#22c55e">DRACO SHOTGUN (LEGENDARY)</text>

  <rect x="630" y="40" width="130" height="34" rx="8" fill="#22c55e"/>
  <text x="645" y="63" font-family="'Orbitron', sans-serif" font-weight="900" font-size="13" fill="#020617">MAX STATS 🔥</text>
</svg>
