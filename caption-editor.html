<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;

}

.app{

}

.logo{
    font-size:20px;
    font-weight:800;
}

.main{
    flex:1;
    display:grid;
    grid-template-columns:270px 1fr 300px;
    min-height:calc(100vh - 64px);
}

.panel{
    padding:18px;

    border-right:1px solid #25252d;

.right{

h3{

}

button,
select,
input{

button{

    padding:10px 13px;

}

.primary{
    width:100%;
    background:#fff;
    color:#000;
    font-weight:700;
    margin-bottom:10px;
}

.secondary{

    margin-bottom:10px;
}

.file{
    width:100%;

.center{

.preview{

}

}

.caption{
    position:absolute;

    bottom:11%;

    width:92%;
    text-align:center;
    font-weight:900;
    line-height:1.05;
    word-break:break-word;
    text-shadow:3px 3px 0 #000;
    pointer-events:none;
}

.caption span{
    display:inline-block;
    margin:2px 3px;
}

.controls{
    width:min(650px,95%);

    gap:8px;

    flex-wrap:wrap;
}

.controls button{

    color:#fff;
}

textarea{
    width:100%;
    min-height:100px;
    resize:vertical;

    border-radius:9px;
    padding:10px;
    outline:none;
}

label{
    display:block;
    font-size:12px;
    color:#aaa;
    margin:13px 0 6px;
}

select,
input[type="text"],
input[type="number"]{
    width:100%;

    color:#fff;
    border:1px solid #30303a;
    border-radius:8px;
    padding:9px;
}

input[type="color"]{
    width:100%;
    height:40px;
    background:#191920;
    border:1px solid #30303a;
    border-radius:8px;
}

.range{
    width:100%;
}

.style-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.style-btn{
    min-height:55px;

    color:#fff;

.status{

@media(max-width:900px){
    .main{
        grid-template-columns:1fr;
    }

    .panel,
    .right{
        border:0;
        border-bottom:1px solid #25252d;
    }

    .center{
        order:-1;
        min-height:70vh;
    }
}
</style>
</head>

<script>

const video = document.getElementById("video");
const videoInput = document.getElementById("videoInput");
const caption = document.getElementById("caption");
const captionText = document.getElementById("captionText");
const font = document.getElementById("font");
const fontSize = document.getElementById("fontSize");
const textColor = document.getElementById("textColor");
const highlightColor = document.getElementById("highlightColor");
const customText = document.getElementById("customText");
const position = document.getElementById("position");
const statusBox = document.getElementById("status");

let recognition = null;


/* VIDEO UPLOAD */

videoInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    video.src = URL.createObjectURL(file);

    video.load();

});


/* CAPTION UPDATE */

function updateCaption(){

    const text = captionText.value || customText.value || "";

    const words = text.trim().split(/\s+/);

    caption.innerHTML = "";

    words.forEach((word,index)=>{

        const span = document.createElement("span");

        span.textContent = word;

        /*
        Important words automatically get different
        sizes/colors for viral-style captions.
        */

        if(
            word.length >= 6 ||
            /[A-Z]/.test(word)
        ){
            span.style.color = highlightColor.value;
            span.style.fontSize = "1.15em";
        }

        caption.appendChild(span);

    });

}


/* TEXT EVENTS */

captionText.addEventListener("input",updateCaption);
customText.addEventListener("input",function(){
    captionText.value = this.value;
    updateCaption();
});


/* FONT */

font.addEventListener("change",function(){

    caption.style.fontFamily = this.value;

});


/* SIZE */

fontSize.addEventListener("input",function(){

    caption.style.fontSize = this.value + "px";

});


/* COLOR */

textColor.addEventListener("input",function(){

    caption.style.color = this.value;

});


/* HIGHLIGHT */

highlightColor.addEventListener("input",updateCaption);


/* POSITION */

position.addEventListener("change",function(){

    caption.style.top = "";
    caption.style.bottom = "";

    if(this.value === "top"){
        caption.style.top = "10%";
        caption.style.bottom = "auto";
    }

    if(this.value === "middle"){
        caption.style.top = "50%";
        caption.style.bottom = "auto";
        caption.style.transform =
            "translate(-50%,-50%)";
    }

    if(this.value === "bottom"){
        caption.style.bottom = "11%";
        caption.style.top = "auto";
        caption.style.transform =
            "translateX(-50%)";
    }

});


/* STYLE */

function applyStyle(style,button){

    caption.className = "caption " + style;

    document
        .querySelectorAll(".style-btn")
        .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    updateCaption();

}


/* PLAY */

function togglePlay(){

    if(video.paused){
        video.play();
    }else{
        video.pause();
    }

}


/* DEMO */

function setDemo(){

    captionText.value =
        "Aaj hum ek AMAZING car repair karenge!";

    updateCaption();

}


/* CLEAR */

function clearCaption(){

    captionText.value = "";

    caption.innerHTML = "";

}


/* SPEECH RECOGNITION */

function startSpeech(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        statusBox.textContent =
            "Speech recognition is not supported. Chrome/Edge use karo.";

        return;
    }

    recognition = new SpeechRecognition();

    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "hi-IN";

    recognition.onstart = function(){

        statusBox.textContent =
            "🎙️ Listening... bolo.";

    };

    recognition.onresult = function(event){

        let finalText = "";

        for(
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ){

            finalText +=
                event.results[i][0].transcript + " ";

        }

        captionText.value = finalText.trim();

        updateCaption();

    };

    recognition.onerror = function(event){

        statusBox.textContent =
            "Error: " + event.error;

    };

    recognition.onend = function(){

        statusBox.textContent =
            "Caption recording stopped.";

    };

    recognition.start();

}


/* STOP */

function stopSpeech(){

    if(recognition){

        recognition.stop();

        recognition = null;

    }

}


/* INITIAL */

updateCaption();

</script>

</body>
</html>
