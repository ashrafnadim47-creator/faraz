<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login | Faraz Store</title>

    <meta
        name="description"
        content="Sign in to your Faraz Store account to manage orders, wishlist, and top-ups."
    >
    <meta name="theme-color" content="#0b0f19">

    <link rel="icon" href="favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- Customer Login -->
    <main class="user-login-page">

        <section
            class="user-login-card glassmorphism"
            aria-labelledby="login-title"
        >

            <header class="user-login-header">
                <h1 id="login-title">
                    ⚡ FARAZ <span>STORE</span>
                </h1>

                <p>CUSTOMER ACCESS PORTAL</p>
            </header>

            <!-- Login Form -->
            <form id="login-form" novalidate>

                <!-- Email -->
                <div class="user-input-group">
                    <label for="email">Email Address</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        inputmode="email"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                        maxlength="254"
                    >
                </div>

                <!-- Password -->
                <div class="user-input-group">
                    <label for="password">Password</label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                        minlength="8"
                    >
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    id="login-btn"
                    class="user-submit-btn"
                >
                    Sign In
                </button>

            </form>

            <!-- Navigation -->
            <footer class="user-login-footer-links">

                <p>
                    New to the store?
                    <a href="signup.html">Create Account</a>
                </p>

                <a
                    href="index.html"
                    class="return-home-link"
                >
                    ← Return to Home Shop
                </a>

            </footer>

        </section>

    </main>

    <!-- Authentication Module -->
    <script
        type="module"
        src="js/auth.js"
        defer
    ></script>

</body>
</html>
