<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Faraz Store</title>
    <meta name="description" content="Sign up for Faraz Store to unlock exclusive gaming gear, top-up vouchers, and rewards.">
    <meta name="theme-color" content="#0b0f19">
    <link rel="icon" href="favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- CSS Links -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- Fullscreen Flex Wrapper for User Signup -->
    <section class="user-login-page">
        
        <div class="user-login-card glassmorphism">
            <div class="user-login-header">
                <h1>⚡ FARAZ <span>STORE</span></h1>
                <p>CREATE YOUR ACCOUNT</p>
            </div>

            <!-- Form Input Fields -->
            <div class="user-input-group">
                <label for="name">Full Name</label>
                <input id="name" type="text" placeholder="Enter your full name" autocomplete="name" required>
            </div>

            <div class="user-input-group">
                <label for="username">Username / Handle (@tag)</label>
                <div style="position: relative;">
                    <input id="username" type="text" placeholder="e.g. faraz_pro" autocomplete="username" autocapitalize="none" spellcheck="false" required style="padding-left: 32px;">
                    <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--primary); font-weight: 800; font-size: 14px;">@</span>
                </div>
                <div id="usernameCheckMsg" style="font-size: 11px; margin-top: 6px; font-weight: 700; min-height: 16px;"></div>
            </div>

            <div class="user-input-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" placeholder="Enter your email address" autocomplete="email" required>
            </div>

            <div class="user-input-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" minlength="6" required>
            </div>

            <!-- Action Submit Trigger -->
            <button id="signup-btn" class="user-submit-btn">
                Create Account
            </button>

            <!-- Navigation Redirection Links -->
            <div class="user-login-footer-links">
                <p>Already have an account? <a href="login.html">Sign In</a></p>
            </div>
        </div>

    </section>

    <!-- Core Auth Tracking Module Engine -->
    <script type="module" src="js/signup.js"></script>

</body>

</html>
