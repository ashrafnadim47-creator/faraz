<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Faraz Store</title>
    <meta name="theme-color" content="#020617">
    <link rel="icon" href="favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">

    <!-- CSS Links -->
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: #020617; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; padding: 15px; margin: 0; }
        .container { max-width: 650px; margin: 15px auto; }
        
        .profile-card {
            position: relative;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            border: 2px solid #00e5ff;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
            margin-bottom: 20px;
            background-size: cover;
            background-position: center;
        }

        .avatar-frame {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #ffcc00;
            box-shadow: 0 0 12px #ffcc00;
            overflow: hidden;
            background: #1e293b;
            flex-shrink: 0;
        }

        .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
        .user-details { flex: 1; }
        .name-row { display: flex; align-items: center; gap: 8px; }
        .username { font-family: 'Orbitron', sans-serif; font-size: 20px; color: #fff; font-weight: 900; margin: 0; }
        .edit-btn { background: none; border: none; color: #00e5ff; cursor: pointer; font-size: 14px; }
        
        .uid-tag { display: inline-flex; align-items: center; gap: 6px; font-family: 'Orbitron', sans-serif; font-size: 11px; color: #00e5ff; background: rgba(0,229,255,0.15); padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(0,229,255,0.3); margin-top: 4px; }

        .stats-row { display: flex; gap: 10px; margin-top: 10px; }
        .badge-item { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; color: #ffcc00; }

        .prime-level-box { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,204,0,0.3); border-radius: 16px; padding: 14px; margin-bottom: 20px; }
        .prime-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 900; color: #ffcc00; margin-bottom: 8px; font-family: 'Orbitron', sans-serif; }
        .progress-bar-bg { background: #1e293b; height: 10px; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { background: linear-gradient(90deg, #ffcc00, #f97316); height: 100%; width: 0%; transition: width 0.5s; }

        .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .quick-box { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 16px; text-align: center; cursor: pointer; transition: transform 0.2s; }
        .quick-box:hover { transform: translateY(-3px); border-color: #00e5ff; }
        .quick-icon { font-size: 28px; margin-bottom: 4px; }
        .quick-title { font-size: 13px; font-weight: 800; color: #f8fafc; }
        .quick-count { font-size: 11px; color: #00e5ff; font-weight: bold; }

        /* VAULT MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.92); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .modal-card { background: #0f172a; border: 2px solid #00e5ff; border-radius: 20px; width: 90%; max-width: 480px; padding: 20px; }
        .vault-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: 280px; overflow-y: auto; padding: 4px; }
        .vault-item { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 8px; text-align: center; cursor: pointer; }
        .vault-item.equipped { border-color: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.4); }
        .vault-item img { width: 45px; height: 45px; object-fit: contain; }
    </style>
</head>

<body>

    <main class="container">
        <a href="index.html" style="color: #00e5ff; text-decoration: none; font-weight: bold; font-size: 13px;">← Back to Shop</a>

        <div class="profile-card" id="profile-banner-bg">
            <div class="avatar-frame">
                <img id="user-avatar-img" src="images/avtar.png" alt="Avatar">
            </div>
            <div class="user-details">
                <div class="name-row">
                    <h2 class="username" id="display-nickname">Gamer</h2>
                    <button class="edit-btn" onclick="changeNickname()">✏️</button>
                </div>
                <div class="uid-tag">
                    <span>ID: <span id="display-player-id">-------</span></span>
                    <span onclick="copyPlayerId()" style="cursor: pointer; color: #ffcc00;">📋</span>
                </div>

                <div class="stats-row">
                    <div class="badge-item">🔥 Streak: <span id="display-streak">1</span> Days</div>
                    <div class="badge-item" onclick="addProfileLike()" style="cursor: pointer;">❤️ Likes: <span id="display-likes">0</span></div>
                    <div class="badge-item" style="color: #00e5ff;">⭐ XP: <span id="display-xp">0</span></div>
                </div>
            </div>
        </div>

        <div class="prime-level-box">
            <div class="prime-header">
                <span id="display-prime-title">👑 PRIME LEVEL 1 (BRONZE)</span>
                <span id="display-diamonds-count">💎 0 / 10,000</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="prime-progress-fill"></div>
            </div>
        </div>

        <div class="quick-grid">
            <div class="quick-box" onclick="openVaultModal()">
                <div class="quick-icon">🧰</div>
                <div class="quick-title">VAULT (INVENTORY)</div>
                <div class="quick-count">Equip Avatar & Banner</div>
            </div>

            <div class="quick-box" onclick="location.href='orders.html'">
                <div class="quick-icon">📦</div>
                <div class="quick-title">MY ORDERS</div>
                <div class="quick-count" id="count-orders">View History</div>
            </div>

            <div class="quick-box" onclick="location.href='wishlist.html'">
                <div class="quick-icon">❤️</div>
                <div class="quick-title">MY WISHLIST</div>
                <div class="quick-count" id="count-wishlist">Saved Items</div>
            </div>

            <div class="quick-box" onclick="location.href='friends.html'">
                <div class="quick-icon">👥</div>
                <div class="quick-title">FRIENDS ARENA</div>
                <div class="quick-count">Online Status</div>
            </div>
        </div>
    </main>

    <!-- VAULT MODAL -->
    <div id="vault-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h2 style="font-family: 'Orbitron', sans-serif; color: #00e5ff; margin: 0; font-size: 16px;">🧰 VAULT INVENTORY</h2>
                <button onclick="closeVaultModal()" style="background: none; border: none; color: #ef4444; font-size: 20px; cursor: pointer;">✖</button>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <button id="vtab-avatars" onclick="switchVaultTab('avatars')" style="flex:1; padding: 8px; background: #00e5ff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">AVATARS</button>
                <button id="vtab-banners" onclick="switchVaultTab('banners')" style="flex:1; padding: 8px; background: #1e293b; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">BANNERS</button>
            </div>

            <div id="vault-items-container" class="vault-grid">
                <!-- Loaded via JS -->
            </div>
        </div>
    </div>

    <script type="module" src="js/profile.js"></script>

</body>

</html>
