<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caption Studio | Faraz</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><div class="top"><a href="../index.html">← Faraz</a><span>Caption Studio</span></div><h1>Caption Studio</h1><p class="sub">Edit captions on a real video timeline. Import SRT, adjust timings/text, preview, and export SRT or VTT.</p><section class="upload-box"><input id="videoInput" type="file" accept="video/*" hidden><input id="srtInput" type="file" accept=".srt,.vtt,text/plain" hidden><div class="actions"><button id="chooseBtn" class="primary">📁 Video</button><button id="srtBtn" class="secondary">📄 Import SRT/VTT</button></div><p id="fileName">No video selected</p></section><section id="editor" class="editor hidden"><video id="video" controls playsinline></video><div class="timeline"><input id="time" type="range" min="0" max="100" value="0"><div class="time-row"><span id="now">00:00.000</span><span id="dur">00:00.000</span></div></div><div class="caption-form"><div class="grid"><label>Start<input id="start" type="number" step=".01" value="0"></label><label>End<input id="end" type="number" step=".01" value="2"></label></div><textarea id="text" rows="4" placeholder="Caption text..."></textarea><div class="actions"><button id="add" class="primary">Add Caption</button><button id="update" class="secondary">Update Selected</button><button id="clear" class="secondary">Clear</button></div></div><div class="preview-caption" id="previewCaption"></div><div class="caption-list" id="list"></div><div class="actions export"><button id="srtOut" class="primary">Export SRT</button><button id="vttOut" class="secondary">Export VTT</button></div></section></main><script src="app.js"></script></body></html>
