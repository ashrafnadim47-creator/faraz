<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎡 Lucky Spin Wheel | Faraz Store</title>
    <meta name="description" content="Spin the lucky wheel and win discount coupons & reward points on Faraz Store!">
    <meta name="theme-color" content="#020617">
    <link rel="icon" href="favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">

    <!-- CSS Links -->
    <link rel="stylesheet" href="css/global.css">
    <style>
        body.spin-page-bg {
            background: #020617;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .spin-container {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 20px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .spin-header { margin-bottom: 20px; }
        .nav-btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #00e5ff;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .spin-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: #00e5ff;
            margin: 0;
        }

        /* WHEEL STRUCTURE */
        .wheel-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 25px auto;
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #ffcc00;
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #00e5ff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
            position: relative;
            overflow: hidden;
            background: conic-gradient(
                #ef4444 0deg 60deg,
                #3b82f6 60deg 120deg,
                #10b981 120deg 180deg,
                #f59e0b 180deg 240deg,
                #6366f1 240deg 300deg,
                #ec4899 300deg 360deg
            );
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
        }

        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: #020617;
            border: 3px solid #00e5ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 900;
            color: #fff;
            z-index: 10;
        }

        .spin-trigger-btn {
            background: linear-gradient(135deg, #00e5ff, #3b82f6);
            color: #020617;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 16px;
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            transition: transform 0.2s;
        }

        .spin-trigger-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #475569;
            color: #94a3b8;
            box-shadow: none;
        }

        .spin-result-text { font-size: 18px; color: #ffcc00; margin-top: 15px; }
        .spin-cooldown-timer { font-size: 13px; color: #94a3b8; margin-top: 8px; }

        /* MODAL POPUP */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .reward-card {
            background: #0f172a; border: 1px solid #00e5ff;
            border-radius: 20px; padding: 30px; text-align: center; max-width: 360px;
        }
        .reward-close-btn {
            background: #00e5ff; color: #000; border: none;
            padding: 10px 20px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 15px;
        }
    </style>
</head>

<body class="spin-page-bg">

    <div class="spin-container">
        <div class="spin-header">
            <button class="nav-btn-back" onclick="location.href='index.html'">← Back to Shop</button>
            <h1 class="spin-title">🎡 FARAZ LUCKY SPIN</h1>
        </div>

        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div id="wheel">
                <div class="center-logo">FARAZ</div>
            </div>
        </div>

        <button id="spin" class="spin-trigger-btn">🎡 SPIN NOW</button>
        <audio id="spin-sound" src="sounds/spin.mp3"></audio>

        <h2 id="result" class="spin-result-text"></h2>
        <p id="coupon-result" class="spin-coupon-code" style="color: #00e5ff; font-weight: bold;"></p>
        <div id="timer" class="spin-cooldown-timer"></div>
    </div>

    <!-- POPUP REWARD MODAL -->
    <div id="reward-popup" class="modal-overlay" style="display: none;">
        <div class="reward-card">
            <div style="font-size: 40px;">🎉</div>
            <h1 style="color: #fff; font-size: 20px; margin: 10px 0;">Congratulations!</h1>
            <h2 id="popup-reward" style="color: #ffcc00; font-size: 22px; margin: 5px 0;"></h2>
            <p id="popup-code" style="color: #00e5ff; font-size: 14px; font-weight: bold;"></p>
            <button id="close-popup" class="reward-close-btn">CLAIM REWARD</button>
        </div>
    </div>

    <script type="module" src="js/spin.js"></script>

</body>

</html>
